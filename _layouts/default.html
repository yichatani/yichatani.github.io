{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  <style>
    .sidebar,
    .sidebar.sticky,
    .sidebar .author__content,

      min-width: 18px;

    <div class="page__footer">
